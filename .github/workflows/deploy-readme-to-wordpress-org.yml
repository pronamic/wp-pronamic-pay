name: Deploy readme.txt to WordPress.org

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run without committing in the WordPress.org Subversion repository'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: WordPress.org plugin directory
      url: ${{ steps.deploy.outputs.public-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github
            .wordpress-org
            readme.txt

      - name: Deploy
        id: deploy
        uses: solvebeam/action-wordpress-org-plugin-readme-deploy@v1.0.1
        with:
          username: ${{ vars.WORDPRESS_ORG_PRONAMIC_USERNAME }}
          password: ${{ secrets.WORDPRESS_ORG_PRONAMIC_PASSWORD }}
          slug: pronamic-ideal
          dry-run: ${{ inputs.dry-run }}
